name: Build Flet APK

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Java and Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk-headless

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install flet packaging

    - name: Create build script
      run: |
        cat > build_apk.py << 'EOF'
        import subprocess
        import sys

        try:
            # Try using flet cli
            result = subprocess.run(['flet', 'build', 'apk', '--output', 'gangstar.apk'],
                                  cwd='/home/runner/work/gangstar-rio/gangstar-rio')
            sys.exit(result.returncode)
        except Exception as e:
            print(f"Build failed: {e}")
            sys.exit(1)
        EOF

    - name: Build APK
      run: python build_apk.py

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gangstar-rio.apk
        path: '**/gangstar*.apk'
        if-no-files-found: ignore
