name: Build Flet APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flet-dev/flet-ci-android:latest

    steps:
    - uses: actions/checkout@v4

    - name: Build APK with Flet
      run: |
        flet build apk --output gangstar.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gangstar-rio.apk
        path: build/outputs/apk/gangstar.apk
        if-no-files-found: ignore
